<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11월 3일을 맞춰라!</title>
<style>
:root{--ink:#f7f8fc;--muted:#b9c5d8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{min-height:100dvh;background:#0b1220;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:manipulation}
.app,.stage{width:100%;height:100dvh}
header,.controls,.rules,.progress-wrap{display:none!important}
button{border:1px solid #ffffff35;border-radius:999px;padding:11px 18px;background:#ffffff0d;color:#fff;font:700 14px system-ui;cursor:pointer}
button.primary{background:#edf6ff;color:#14243b;border-color:#edf6ff}

.stage{
 position:fixed;inset:0;isolation:isolate;overflow:hidden;
 background:linear-gradient(160deg,#91c5e7,#f0d7b6 65%,#789b7b);
 transition:background 2.5s ease;
}
.stage:before{
 content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(180deg,#07162b22,#07162b00 45%,#07162b55);
 pointer-events:none;
}
.sky-sun{
 position:absolute;right:12%;top:12%;width:70px;height:70px;
 border-radius:50%;background:#fff1bd;
 box-shadow:0 0 60px #fff0bdaa;
 transition:background 2.5s ease,box-shadow 2.5s ease,opacity 2.5s ease;
}
.cloud{
 position:absolute;top:27%;left:-120px;width:110px;height:30px;
 border-radius:50px;background:#ffffffa6;
 animation:cloud 24s linear infinite;
 transition:background 2.5s ease;
}
.cloud:before,.cloud:after{
 content:"";position:absolute;background:inherit;border-radius:50%;bottom:5px
}
.cloud:before{width:43px;height:43px;left:18px}
.cloud:after{width:34px;height:34px;left:56px}
@keyframes cloud{to{left:110%}}

.hills{position:absolute;bottom:0;width:100%;height:35%;z-index:-1}
.hill1,.hill2{transition:fill 2.5s ease}
.hill1{fill:#76a77c}
.hill2{fill:#346d58}

.date-wrap{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;padding:18px 12px;text-align:center;
}
.date-big{
 font-size:clamp(78px,17vw,172px);font-weight:950;
 line-height:.95;letter-spacing:-.085em;color:white;
 text-shadow:0 5px 0 #18283a55,0 12px 32px #12223866;
 font-variant-numeric:tabular-nums;white-space:nowrap;
}
.date-big .md{display:block}
.date-big .slash{color:#fff9;margin:0 .04em}
.date-big .day{color:#fff1bd}
.date-label{
 margin-top:18px;font-size:clamp(14px,2.3vw,19px);
 font-weight:750;letter-spacing:.04em;color:#fff;
 text-shadow:0 2px 8px #14253a88;
 line-height:1.7;
}
.brand-label{
 position:absolute;top:18px;left:20px;z-index:3;
 padding:9px 13px;border-radius:13px;background:#14243b66;
 border:1px solid #ffffff66;font-size:clamp(11px,2.5vw,14px);
 font-weight:750;letter-spacing:-.02em;backdrop-filter:blur(8px);
 color:#fff;box-shadow:0 5px 18px #14243b18;
}
.brand-label strong{
 display:inline-block;margin-left:4px;font-size:1.35em;
 font-weight:1000;letter-spacing:.06em;color:#fff1a8;
 text-shadow:0 0 12px #ffe89a77;
}

/* 기념일 알림 */
.special-toast{
 position:absolute;z-index:3;left:50%;bottom:30px;
 transform:translate(-50%,18px);opacity:0;pointer-events:none;
 padding:11px 18px;border-radius:999px;background:#fff5d9;
 color:#203047;font-weight:850;font-size:clamp(14px,2.5vw,19px);
 box-shadow:0 8px 30px #0004;white-space:nowrap;
 transition:opacity .4s,transform .4s;
}
.special-toast.visible{opacity:1;transform:translate(-50%,0)}

.overlay{
 position:absolute;inset:0;z-index:5;display:none;place-items:center;
 padding:24px;background:#0b1424d9;backdrop-filter:blur(9px);
 text-align:center;
}
.overlay.show{display:grid;animation:result-pop .4s cubic-bezier(.16,1,.3,1) both}
.dialog{max-width:460px}
.dialog .emoji{font-size:58px}
.dialog h2{font-size:clamp(34px,7vw,56px);margin:6px 0 10px;letter-spacing:-.06em}
.dialog p{color:#d6deeb;line-height:1.8;margin:0 0 20px}
.dialog.success h2{color:#a8efc0}
.dialog.fail h2{color:#ffb1b9}
.dialog.timeout h2{color:#ffe3a2}

.stage:after{
 content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
 background:#050914;opacity:0;transition:opacity .7s ease;
}
.stage.transition-dark:after{opacity:.97}
.stage.transition-bright:after{opacity:0;transition-duration:1.2s}
.stage.transition-bright .date-wrap{
 animation:date-arrive .8s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes date-arrive{
 0%{opacity:0;transform:scale(.94);filter:brightness(1.8)}
 65%{opacity:1;transform:scale(1.025);filter:brightness(1.2)}
 100%{opacity:1;transform:scale(1);filter:brightness(1)}
}
@keyframes result-pop{
 0%{opacity:0;transform:scale(.9);filter:blur(7px)}
 70%{opacity:1;transform:scale(1.025);filter:blur(0)}
 100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.overlay.show .dialog{animation:dialog-pop .45s cubic-bezier(.16,1,.3,1) both}
@keyframes dialog-pop{
 0%{opacity:0;transform:translateY(22px) scale(.9)}
 70%{opacity:1;transform:translateY(-3px) scale(1.02)}
 100%{opacity:1;transform:translateY(0) scale(1)}
}
.intro{
 position:absolute;inset:0;z-index:6;display:grid;place-items:center;
 text-align:center;padding:24px;background:#0914269c;
 backdrop-filter:blur(2px);transition:opacity .45s,visibility .45s;
}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro-card{
 width:min(460px,100%);padding:28px 22px;
 border:1px solid #ffffff55;border-radius:28px;
 background:#101d30a8;box-shadow:0 18px 70px #0004;
 animation:dialog-pop .6s both;
}
.intro-kicker{font-size:11px;letter-spacing:.22em;color:#b9dfff;font-weight:900}
.intro h2{font-size:clamp(34px,8vw,62px);line-height:1.08;letter-spacing:-.065em;margin:12px 0}
.intro p{color:#dbe5f2;line-height:1.8;font-size:14px;margin:0 0 22px}
.intro button,.dialog button{font-size:15px;padding:13px 24px;min-width:150px}
#stopAnywhere{
 position:absolute;inset:0;z-index:2;border:0;border-radius:0;
 background:transparent;padding:0;width:100%;height:100%;display:none;
}
.stage.running #stopAnywhere{display:block}

@media(max-width:560px){
 .sky-sun{width:48px;height:48px}
 .brand-label{top:12px;left:12px;padding:8px 10px}
 .date-big{font-size:clamp(66px,18vw,120px)}
 .intro-card{padding:25px 18px}
}
@media(prefers-reduced-motion:reduce){
 .stage,.hill1,.hill2,.sky-sun,.cloud{transition-duration:.01ms}
}
</style>
</head>
<body>
<main class="app">
<section class="stage" id="stage">
  <div class="sky-sun" id="sun"></div>
  <div class="cloud"></div>

  <svg class="hills" viewBox="0 0 900 250" preserveAspectRatio="none" aria-hidden="true">
    <path id="hill1" class="hill1" d="M0 160 Q110 80 240 145 T500 120 T740 135 T900 90 L900 250 L0 250Z"/>
    <path id="hill2" class="hill2" d="M0 190 Q120 125 260 175 T510 150 T760 170 T900 140 L900 250 L0 250Z"/>
  </svg>

  <div class="brand-label">내포중학교 학생회 <strong>온율</strong></div>

  <div class="date-wrap">
    <div>
      <div class="date-big" id="dateBig">
        <span class="md"><span>01</span><span class="slash">.</span><span class="day">01</span></span>
      </div>
      <div class="date-label" id="dateLabel">시작 버튼을 눌러 시간 흐름 시작</div>
    </div>
  </div>

  <div class="special-toast" id="specialToast" aria-live="polite"></div>
  <button id="stopAnywhere" aria-label="화면을 눌러 날짜 멈추기"></button>

  <div class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-kicker">DATE TIMING GAME</div>
      <h2>11월 3일을<br>맞춰라!</h2>
      <p>날짜가 빠르게 흘러가.<br>2026년 11월 3일이라고 생각되는 순간<br>화면 아무 곳이나 눌러 멈춰!</p>
      <button class="primary" id="start">▶ 시작하기</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog">
      <div class="emoji" id="emoji">🏁</div>
      <h2 id="resultTitle">게임 종료</h2>
      <p id="resultText"></p>
      <button class="primary" id="again">다시 도전하기</button>
    </div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);

const months=[
 ["❄️ 겨울의 시작","#7d9db8","#536d84","linear-gradient(160deg,#405b79,#bdc6ce)"],
 ["❄️ 봄을 기다리는 겨울","#92a6b5","#637987","linear-gradient(160deg,#6b8294,#d4cbc1)"],
 ["🌱 봄이 오고 있어","#8ebd93","#4d866e","linear-gradient(160deg,#85bce1,#f2d9bd)"],
 ["🌸 꽃이 피어나는 봄","#8fc58e","#4b936f","linear-gradient(160deg,#8dc9e9,#f7e1ce)"],
 ["🌿 초록이 짙어져","#80b879","#347957","linear-gradient(160deg,#78bfe8,#f3dfb6)"],
 ["☀️ 여름이 다가와","#76a86a","#326c4c","linear-gradient(160deg,#5ca9e2,#f1d2a6)"],
 ["🌞 한여름","#619b58","#285d40","linear-gradient(160deg,#399cdd,#f6cc8d)"],
 ["🌻 여름의 끝자락","#78975a","#416342","linear-gradient(160deg,#4e9fd7,#eacba5)"],
 ["🍂 가을이 시작돼","#a6a16d","#65784e","linear-gradient(160deg,#75a9d1,#ecd1ae)"],
 ["🍁 가을이 깊어져","#b17d52","#81543e","linear-gradient(160deg,#688fb3,#e6bd94)"],
 ["🎯 목표 날짜가 있는 달","#8d806c","#55564c","linear-gradient(160deg,#526b86,#c3b1a2)"],
 ["✨ 한 해의 마지막","#8395a4","#4d6175","linear-gradient(160deg,#263a58,#8595a9)"]
];

const GAME_CONFIG={
 targetMonth:11,
 targetDay:3,
 yearLengthDays:365,
 secondsPerYear:24,
 successBonusDays:0,
 resultTransitionMs:520,
 startTransitionMs:850,
 year:2026
};

const SPECIAL_DAYS={
 "3-1":{message:"🇰🇷 3월 1일 · 삼일절"},
 "6-6":{message:"🎗️ 6월 6일 · 현충일"},
 "8-15":{message:"🇰🇷 8월 15일 · 광복절"},
 "10-3":{message:"🇰🇷 10월 3일 · 개천절"},
 "10-9":{message:"✍️ 10월 9일 · 한글날"},
 "11-3":{message:"📚 11월 3일 · 학생독립운동기념일"}
};

const startDate=Date.UTC(GAME_CONFIG.year,0,1);
const totalMs=Date.UTC(GAME_CONFIG.year+1,0,1)-startDate;
const targetMs=Date.UTC(GAME_CONFIG.year,GAME_CONFIG.targetMonth-1,GAME_CONFIG.targetDay)-startDate;

let running=false,finished=false,simMs=0,lastFrame=0,raf=0,lastShownSpecial="";
let specialTimer=0,transitionTimer=0;
const speed=totalMs/(GAME_CONFIG.secondsPerYear*1000);

function render(){
 const day=Math.min(GAME_CONFIG.yearLengthDays-1,Math.floor(simMs/(totalMs/GAME_CONFIG.yearLengthDays)));
 const date=new Date(startDate+day*86400000);
 const m=date.getUTCMonth(),d=date.getUTCDate();

 $("dateBig").innerHTML=`<span class="md"><span>${String(m+1).padStart(2,"0")}</span><span class="slash">.</span><span class="day">${String(d).padStart(2,"0")}</span></span>`;
 $("hill1").setAttribute("fill",months[m][1]);
 $("hill2").setAttribute("fill",months[m][2]);
 $("stage").style.background=months[m][3];
 $("sun").style.opacity=(m>=4&&m<=7)?1:.65;
 $("sun").style.background=m>=5&&m<=7?"#fff5c7":"#fff1bd";
 $("sun").style.boxShadow=m>=5&&m<=7?"0 0 80px #fff0bdcc":"0 0 60px #fff0bdaa";

 $("dateLabel").textContent=
   running?"날짜가 흐르는 중… 목표일에 멈춰!":
   finished?"게임이 종료됐어":
   "시작 버튼을 눌러 시간 흐름 시작";

 const key=`${m+1}-${d}`;
 if(running&&SPECIAL_DAYS[key]&&key!==lastShownSpecial){
   lastShownSpecial=key;
   const toast=$("specialToast");
   toast.textContent=SPECIAL_DAYS[key].message;
   toast.classList.add("visible");
   clearTimeout(specialTimer);
   specialTimer=setTimeout(()=>toast.classList.remove("visible"),2200);
 }

 // 목표일에는 날짜 아래에 기념일 이름을 고정 표시
 if(m+1===GAME_CONFIG.targetMonth&&d===GAME_CONFIG.targetDay){
   $("dateLabel").innerHTML="📚 学生独立运动纪念日<br>학생독립운동기념일";
 } else if(running){
   $("dateLabel").textContent="날짜가 흐르는 중… 목표일에 멈춰!";
 } else if(!finished){
   $("dateLabel").textContent="시작 버튼을 눌러 시간 흐름 시작";
 }
}

function finish(kind,message){
 running=false;
 finished=true;
 cancelAnimationFrame(raf);
 clearTimeout(transitionTimer);
 $("stage").classList.remove("running","transition-bright");
 $("stage").classList.add("transition-dark");
 $("dialog").className="dialog "+kind;

 if(kind==="success"){
   $("emoji").textContent="🎉";
   $("resultTitle").textContent="성공!";
   $("resultText").textContent=`정확히 ${GAME_CONFIG.targetMonth}월 ${GAME_CONFIG.targetDay}일에 멈췄어! 날짜 감각이 대단해.`;
 }else if(kind==="timeout"){
   $("emoji").textContent="⌛";
   $("resultTitle").textContent="타임오버";
   $("resultText").textContent="12월 31일까지 시간이 다 지나갔어. 목표 날짜를 놓쳤어!";
 }else{
   $("emoji").textContent="💥";
   $("resultTitle").textContent="게임 오버 · 실패";
   $("resultText").textContent=message||"목표 날짜가 아니야. 다음에는 더 정확히 맞춰 봐!";
 }

 $("overlay").classList.remove("show");
 transitionTimer=setTimeout(()=> $("overlay").classList.add("show"),GAME_CONFIG.resultTransitionMs);
}

function frame(now){
 if(!running)return;
 if(!lastFrame)lastFrame=now;
 const delta=Math.min(now-lastFrame,100);
 lastFrame=now;
 simMs+=delta*speed;

 if(simMs>=totalMs){
   simMs=totalMs-1;
   render();
   finish("timeout");
   return;
 }
 render();
 raf=requestAnimationFrame(frame);
}

function start(){
 if(running||finished)return;
 simMs=0;
 lastFrame=0;
 lastShownSpecial="";
 render();

 const stage=$("stage");
 stage.classList.remove("transition-bright");
 stage.classList.add("transition-dark");
 $("intro").classList.add("hidden");
 running=true;
 stage.classList.add("running");

 transitionTimer=setTimeout(()=>{
   if(!running||finished)return;
   stage.classList.remove("transition-dark");
   stage.classList.add("transition-bright");
   transitionTimer=setTimeout(()=>{
     if(!running||finished)return;
     raf=requestAnimationFrame(frame);
   },Math.max(0,GAME_CONFIG.startTransitionMs-300));
 },300);
}

function stop(){
 if(!running||finished)return;
 const diff=Math.abs(simMs-targetMs);
 const oneDay=totalMs/GAME_CONFIG.yearLengthDays;
 const allowedDays=0.45+Math.max(0,GAME_CONFIG.successBonusDays);

 if(diff<=oneDay*allowedDays){
   simMs=targetMs;
   render();
   finish("success");
 }else{
   const date=new Date(startDate+Math.max(0,Math.floor(simMs/oneDay))*86400000);
   finish("fail",`멈춘 날짜는 ${date.getUTCMonth()+1}월 ${date.getUTCDate()}일이야. 목표는 ${GAME_CONFIG.targetMonth}월 ${GAME_CONFIG.targetDay}일이야!`);
 }
}

function reset(){
 running=false;
 finished=false;
 simMs=0;
 lastFrame=0;
 lastShownSpecial="";
 cancelAnimationFrame(raf);
 clearTimeout(specialTimer);
 clearTimeout(transitionTimer);
 $("stage").classList.remove("running","transition-dark","transition-bright");
 $("overlay").classList.remove("show");
 $("intro").classList.remove("hidden");
 $("specialToast").classList.remove("visible");
 render();
}

$("start").addEventListener("click",e=>{e.stopPropagation();start()});
$("stopAnywhere").addEventListener("click",stop);
$("again").addEventListener("click",e=>{e.stopPropagation();reset()});
$("stage").addEventListener("click",e=>{
 if(running&&e.target!==$("stopAnywhere"))stop();
});
render();
</script>
</body>
</html>
